name: Auto Live Trading Bot

on:
  workflow_dispatch: # जब चाहें मैनुअली बटन दबाकर चलाने के लिए
  schedule:
    # सोमवार से शुक्रवार सुबह 9:00 AM IST (3:30 AM UTC) पर अपने आप चालू होगा
    - cron: '30 3 * * 1-5'

jobs:
  run-trading-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6 घंटे (सुबह 9:00 से दोपहर 3:00+ तक) लगातार चलने के लिए

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests

      - name: Start Trading Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: "5610520408"
        run: python -u bot.py
